<ng-content select="[card-img]"></ng-content>

<section>
  @for (item of list(); track item) {
    <ng-container *ngTemplateOutlet="listItemTemplate(); context: {$implicit: item, index: $index}" />
  }
</section>

<button
  #addButton
  class="rounded-sm border border-blue-500 bg-blue-300 p-2"
  (click)="addOne.emit()">
  Add
</button>
