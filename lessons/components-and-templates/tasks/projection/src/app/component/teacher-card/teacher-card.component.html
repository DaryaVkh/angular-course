<app-card
  [list]="teachers()"
  (addOne)="addTeacher()"
  class="bg-light-red">
  <img card-img ngSrc="assets/img/teacher.png" width="200" height="200" alt="Учитель" priority />

  <ng-template let-item>
    <app-list-item [name]="getName(item)" (delete)="deleteOne(item.id)"></app-list-item>
  </ng-template>
</app-card>
