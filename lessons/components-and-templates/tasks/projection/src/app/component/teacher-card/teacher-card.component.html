<app-card
  [list]="teachers()"
  (addItem)="addTeacher()"
  style="--card-bg: rgba(250, 0, 0, 0.1)">
  <img
    card-img
    ngSrc="assets/img/teacher.png"
    width="200"
    height="200"
    priority
    alt="Учитель" />

  <h3 card-header>Учителя</h3>

  <ng-template let-teacher>
    <app-list-item
      [id]="teacher.id"
      [name]="teacher.firstName"
      (delete)="deleteTeacher($event)" />
  </ng-template>
</app-card>
