<app-card [list]="cities()" (addItem)="addCity()">
  <img ngSrc="assets/img/city.png" width="200" height="200" priority />

  <ng-template let-item let-i="index">
    <app-list-item
      [name]="item.name"
      [id]="item.id"
      (removeItem)="removeCity(item.id)"></app-list-item>
  </ng-template>
</app-card>
