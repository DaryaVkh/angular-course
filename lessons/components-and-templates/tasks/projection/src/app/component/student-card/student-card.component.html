<app-card
  [list]="students()"
  customClass="bg-light-green"
  (add)="onAdd()"
  (delete)="onDelete($event)">
  <img card-img ngSrc="assets/img/student.webp" width="200" height="200" priority />
  <h3 card-header>Студенты</h3>
  <ng-template let-student let-i="index">
    <app-list-item
      [name]="student.firstName"
      [id]="student.id"
      [type]="cardType"
      (delete)="onDelete($event)">
    </app-list-item>
  </ng-template>
</app-card>
