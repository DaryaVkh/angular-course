<app-card
  [list]="students()"
  (addItem)="addStudent()">
  <h3 #cardHeader card-header>Студенты</h3>
  <img
    card-image
    ngSrc="assets/img/student.webp"
    width="200"
    height="200"
    priority
    alt="Студенты с книгами"/>

  <ng-template let-item let-i="index">
    <app-list-item
      [name]="item.firstName"
      [id]="item.id"
      (deleteItem)="deleteStudent($event)">
    </app-list-item>
  </ng-template>
</app-card>
