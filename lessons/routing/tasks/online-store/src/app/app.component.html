<div class="min-h-screen bg-slate-50">
  <header class="sticky top-0 z-10 border-b border-slate-200 bg-white/90 backdrop-blur">
    <nav class="mx-auto flex max-w-6xl items-center justify-between gap-4 px-4 py-3 sm:px-6">
      <a routerLink="/catalog" class="flex items-center gap-2 font-extrabold text-slate-900">
        <span class="grid h-8 w-8 place-items-center rounded-lg bg-indigo-600 text-white">🛍️</span>
        Angular Store
      </a>

      <div class="flex items-center gap-1 text-sm font-medium">
        <a
          routerLink="/catalog"
          routerLinkActive="text-indigo-600"
          class="rounded-lg px-3 py-2 text-slate-600 transition hover:text-indigo-600"
        >
          Каталог
        </a>
        <a
          routerLink="/admin"
          routerLinkActive="text-indigo-600"
          class="rounded-lg px-3 py-2 text-slate-600 transition hover:text-indigo-600"
        >
          Admin
        </a>
        @if (auth.isAuthenticated()) {
          <a
            routerLink="/profile"
            routerLinkActive="text-indigo-600"
            class="rounded-lg px-3 py-2 text-slate-600 transition hover:text-indigo-600"
          >
            {{ auth.currentUser()?.username }}
          </a>
          <button
            type="button"
            class="rounded-lg px-3 py-2 text-slate-500 transition hover:text-rose-600"
            (click)="auth.logout()"
          >
            Выйти
          </button>
        } @else {
          <a
            routerLink="/login"
            routerLinkActive="text-indigo-600"
            class="rounded-lg px-3 py-2 text-slate-600 transition hover:text-indigo-600"
          >
            Войти
          </a>
        }
        <a
          routerLink="/cart"
          routerLinkActive="bg-indigo-600 text-white"
          class="relative ml-2 flex items-center gap-1.5 rounded-lg border border-slate-200 px-3 py-2 text-slate-700 transition hover:border-indigo-300"
        >
          🛒 Корзина
          @if (cart.count() > 0) {
            <span
              class="grid h-5 w-5 place-items-center rounded-full bg-rose-500 text-xs font-bold text-white"
            >
                  {{ cart.count() }}
                </span>
          }
        </a>
      </div>
    </nav>
  </header>

  <main>
    <router-outlet />
  </main>
</div>
