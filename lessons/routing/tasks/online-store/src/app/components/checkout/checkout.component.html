<section class="mx-auto max-w-xl px-4 py-8 sm:px-6">
  <h1 class="text-2xl font-bold text-slate-900">Оформление заказа</h1>

  <form class="mt-6 flex flex-col gap-4" (submit)="submit($event)">
    <label class="flex flex-col gap-1 text-sm font-medium text-slate-700">
      Имя и фамилия
      <input
        type="text"
        required
        class="rounded-lg border border-slate-300 px-3 py-2"
        [value]="fullName()"
        (input)="onFullNameChange($any($event.target).value)"
      />
    </label>
    <label class="flex flex-col gap-1 text-sm font-medium text-slate-700">
      Адрес доставки
      <input
        type="text"
        required
        class="rounded-lg border border-slate-300 px-3 py-2"
        [value]="address()"
        (input)="onAddressChange($any($event.target).value)"
      />
    </label>
    <p class="text-sm text-slate-500">
      Товаров в заказе: {{ cart.count() }} на сумму {{ cart.total() | number: '1.2-2' }} €
    </p>
    <button
      type="submit"
      [disabled]="placing()"
      class="rounded-lg bg-indigo-600 px-5 py-2.5 font-medium text-white transition hover:bg-indigo-700 disabled:opacity-50"
    >
      {{ placing() ? 'Оформляем...' : 'Подтвердить заказ' }}
    </button>
  </form>
</section>
