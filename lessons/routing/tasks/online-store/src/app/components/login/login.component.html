<section class="mx-auto max-w-sm px-4 py-16 sm:px-6">
  <h1 class="text-2xl font-bold text-slate-900">Вход</h1>
  <p class="mt-2 text-sm text-slate-500">
    Тестовые аккаунты: <code class="rounded bg-slate-100 px-1.5 py-0.5">user / user123</code> и
    <code class="rounded bg-slate-100 px-1.5 py-0.5">admin / admin123</code>.
  </p>

  <form class="mt-6 flex flex-col gap-4" (submit)="submit($event)">
    <label class="flex flex-col gap-1 text-sm font-medium text-slate-700">
      Логин
      <input
        type="text"
        required
        class="rounded-lg border border-slate-300 px-3 py-2"
        [value]="username()"
        (input)="username.set($any($event.target).value)"
      />
    </label>
    <label class="flex flex-col gap-1 text-sm font-medium text-slate-700">
      Пароль
      <input
        type="password"
        required
        class="rounded-lg border border-slate-300 px-3 py-2"
        [value]="password()"
        (input)="password.set($any($event.target).value)"
      />
    </label>

    @if (error()) {
      <p class="text-sm text-rose-600">{{ error() }}</p>
    }

    <button
      type="submit"
      [disabled]="loading()"
      class="rounded-lg bg-indigo-600 px-5 py-2.5 font-medium text-white transition hover:bg-indigo-700 disabled:opacity-50"
    >
      {{ loading() ? 'Входим...' : 'Войти' }}
    </button>
  </form>
</section>
